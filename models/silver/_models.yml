version: 2
models:

  - name: cwl_seasons
    description: Una fila por temporada de CWL presente en los grupos cargados. Sirve como referencia temporal
      para agrupar y comparar temporadas.
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
        data_tests:
          - not_null
          - unique
      - name: month_start_date
        description: Primer dia del mes de referencia de la temporada.

  - name: leagues
    description: Una fila por división de CWL Relaciona el id de la división con su nombre.
    columns:
      - name: division_id
        description: Id de la division registrada para el grupo.
        data_tests:
          - not_null
          - unique
      - name: division_name
        description: Nombre de la division tal como quedó registrado en la captura.

  - name: clans
    description: Una fila por tag de clan observado en grupos de CWL o en guerras normales, incluido el rival.
    columns:
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
        data_tests:
          - not_null
          - unique
      - name: clan_name
        description: Nombre del clan observado en los datos cargados.
      - name: name_observed_season
        description: Temporada o mes del registro del que se obtuvo el nombre elegido.

  - name: players
    description: Una fila por tag de jugador observado en el roster de un grupo o en la alineación de una guerra CWL.
    columns:
      - name: player_tag
        description: 'Tag del jugador, incluido el prefijo #.'
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: Nombre del jugador observado en los datos cargados.
      - name: name_observed_season
        description: Temporada o mes del registro del que se obtuvo el nombre elegido.

  - name: cwl_groups
    description: Una fila por temporada y grupo de CWL. Vincula el grupo con su división y conserva el estado
      y el num de clanes que figuran en el grupo capturado.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - season
              - group_id
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
        data_tests:
          - not_null
      - name: group_id
        description: Id del grupo dentro de la temporada.
        data_tests:
          - not_null
      - name: division_id
        description: Id de la division registrada para el grupo.
      - name: group_state
        description: Estado del grupo según la API cuando se capturo.
      - name: clan_count
        description: Num de clanes presentes en el JSON del grupo.

  - name: group_clans
    description: Una fila por clan inscrito en un grupo de una temporada de CWL. Conserva los datos del clan observados
      en el grupo y su lista de inscritos, que alimenta cwl_roster.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - season
              - group_id
              - clan_tag
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
        data_tests:
          - not_null
      - name: group_id
        description: Id del grupo dentro de la temporada.
        data_tests:
          - not_null
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: clan_name
        description: Nombre del clan observado en los datos cargados.
      - name: clan_level
        description: Nivel del clan según el registro del grupo capturado.
      - name: registered_player_count
        description: Cantidad de jugadores inscritos por el clan en ese grupo.
      - name: roster_payload
        description: Array JSON de jugadores inscritos. Se expande en cwl_roster.

  - name: cwl_roster
    description: Una fila por jugador inscrito por un clan en un grupo de una temporada CWL. Incluye los inscritos
      que nunca fueron alineados y permite medir qué parte del roster llegó a jugar.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - season
              - group_id
              - clan_tag
              - player_tag
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
        data_tests:
          - not_null
      - name: group_id
        description: Id del grupo dentro de la temporada.
        data_tests:
          - not_null
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: player_tag
        description: 'Tag del jugador, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: player_name
        description: Nombre del jugador observado en los datos cargados.
      - name: town_hall_level
        description: Nivel de ayuntamiento que figura en la inscripción al grupo.

  - name: cwl_wars
    description: Una fila por guerra CWL finalizada. Identifica el grupo, la ronda y ambos clanes. El tamaño corresponde
      a un bando y el cupo de ataques se expresa por jugador alineado.
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
      - name: group_id
        description: Id del grupo dentro de la temporada.
      - name: war_tag
        description: Tag de la guerra CWL asignado por la API.
        data_tests:
          - not_null
          - unique
      - name: round_number
        description: Num de ronda en el grupo CWL.
      - name: team_size
        description: Num de jugadores que puede alinear cada bando.
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
      - name: opponent_tag
        description: Tag del clan rival.
      - name: attacks_per_member
        description: Cupo de ataques por jugador alineado en la guerra.

  - name: normal_wars
    description: Una fila por guerra normal única que terminó en el mes indicado. Si la guerra aparece en ambos
      historiales, comparte identificador y se representa una vez con los tags en orden canónico.
    columns:
      - name: season
        description: Mes de cierre de la guerra en UTC, en formato AAAA-MM.
      - name: war_id
        description: Clave estable formada por la fecha de cierre UTC y los dos tags de clan ordenados.
        data_tests:
          - not_null
          - unique
      - name: end_time_utc
        description: Fecha y hora de cierre de la guerra, en UTC.
      - name: clan_a_tag
        description: Primero de los dos tags de clan en orden canónico.
      - name: clan_b_tag
        description: Segundo de los dos tags de clan en orden canónico.
      - name: team_size
        description: Num de jugadores que puede alinear cada bando.
      - name: attacks_per_member
        description: Cupo de ataques por jugador alineado en la guerra.

  - name: clan_wars
    description: Una fila por clan y guerra CWL finalizada. Conserva las dos perspectivas de cada guerra y calcula
      el resultado comparando primero las estrellas y después la destrucción. Alimenta war_results.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - war_tag
              - clan_tag
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
      - name: group_id
        description: id del grupo dentro de la temporada.
      - name: war_tag
        description: Tag de la guerra CWL asignado por la API.
        data_tests:
          - not_null
      - name: round_number
        description: Num de ronda en el grupo CWL.
      - name: team_size
        description: Num de jugadores que puede alinear cada bando.
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: opponent_tag
        description: Tag del clan rival.
      - name: attacks_used
        description: Num de ataques realizados por el clan en la guerra.
      - name: stars
        description: Estrellas del clan en el marcador de la guerra.
      - name: opponent_stars
        description: Estrellas del rival en el marcador de la guerra.
      - name: destruction_pct
        description: Porcentaje de destrucción, en escala de 0 a 100.
      - name: opponent_destruction_pct
        description: Porcentaje de destrucción del rival, en escala de 0 a 100.
      - name: attacks_available
        description: Cupo total del clan en esa guerra. Sirve de denominador para calcular el uso de ataques.
      - name: result
        description: 'Resultado desde la perspectiva del clan: win, lose o tie. Puede ser nulo si falta el marcador
          necesario.'

  - name: war_results
    description: Una fila por formato, guerra y clan observado. Unifica el resultado de CWL y guerras normales
      para comparar victorias, destrucción y uso de ataques. Grupo y ronda se rellenan en CWL.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - war_type
              - war_id
              - clan_tag
    columns:
      - name: season
        description: Temporada de la CWL o mes de cierre UTC de la guerra normal, en formato AAAA-MM.
      - name: war_type
        description: 'Formato de guerra: cwl o normal.'
        data_tests:
          - not_null
      - name: war_id
        description: Tag de la guerra para CWL. Clave de fecha de cierre y tags ordenados para una guerra normal.
        data_tests:
          - not_null
      - name: group_id
        description: id del grupo CWL. Es nulo en guerras normales.
      - name: round_number
        description: Ronda del grupo CWL. Es nula en guerras normales.
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: opponent_tag
        description: Tag del clan rival.
      - name: team_size
        description: Num de jugadores que puede alinear cada bando.
      - name: attacks_used
        description: Num de ataques realizados por el clan en la guerra.
      - name: attacks_available
        description: Tamaño del bando multiplicado por el cupo por jugador del formato en esa guerra.
      - name: stars
        description: Estrellas del clan en el marcador de la guerra.
      - name: destruction_pct
        description: Porcentaje de destrucción, en escala de 0 a 100.
      - name: result
        description: 'Resultado desde la perspectiva del clan de la fila: win, lose o tie.'

  - name: cwl_war_participants
    description: Una fila por jugador alineado en una guerra CWL finalizada, con su posición, ayuntamiento y ataques
      realizados, incluidos los jugadores con cero ataques.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - war_tag
              - player_tag
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
      - name: war_tag
        description: Tag de la guerra CWL asignado por la API.
        data_tests:
          - not_null
      - name: clan_tag
        description: 'Tag del clan, incluido el prefijo #.'
      - name: player_tag
        description: 'Tag del jugador, incluido el prefijo #.'
        data_tests:
          - not_null
      - name: player_name
        description: Nombre del jugador observado en los datos cargados.
      - name: town_hall_level
        description: Nivel de ayuntamiento que figura en la alineación de la guerra.
      - name: map_position
        description: Posición del jugador en el mapa de su bando en esa guerra.
      - name: attacks_used
        description: Num de ataques realizados por el jugador. Cero si estuvo alineado y no atacó.
      - name: attacks_payload
        description: Array JSON con los ataques realizados por este jugador en la guerra. Puede venir vacío o
          ausente.

  - name: attacks
    description: Una fila por ataque realizado en CWL. Vincula atacante y defensor a sus alineaciones de la misma
      guerra y clasifica el cruce según el nivel de ayuntamiento de ambos en ese momento.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - war_tag
              - attack_order
    columns:
      - name: season
        description: Temporada de CWL en formato AAAA-MM.
      - name: war_tag
        description: Tag de la guerra CWL asignado por la API.
        data_tests:
          - not_null
      - name: attack_order
        description: Orden del ataque en la secuencia de la guerra según la API.
        data_tests:
          - not_null
      - name: attacker_clan_tag
        description: Tag del clan del atacante en esa guerra.
      - name: attacker_tag
        description: Tag del jugador que realizó el ataque.
        data_tests:
          - not_null
      - name: attacker_th
        description: Nivel de ayuntamiento del atacante en la alineación de esa guerra.
      - name: defender_clan_tag
        description: Tag del clan del defensor en esa guerra.
        data_tests:
          - not_null
      - name: defender_tag
        description: Tag del jugador que recibió el ataque.
        data_tests:
          - not_null
      - name: defender_th
        description: Nivel de ayuntamiento del defensor en la alineación de esa guerra.
      - name: stars
        description: Estrellas logradas en este ataque.
      - name: destruction_pct
        description: Destrucción lograda en este ataque, en escala de 0 a 100.
      - name: matchup
        description: 'Comparación con el ayuntamiento del defensor: down-hit si es menor, same-TH si es igual
          y up-hit si es mayor. Es nulo si falta alguno de los dos niveles.'

  - name: normal_war_coverage
    description: Una fila por mes y clan consultado en el historial de guerras normales. Permite auditar los clanes
      incluidos en la comparación.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names:
              - season
              - clan_tag
    columns:
      - name: season
        description: Mes consultado en UTC, en formato AAAA-MM.
        data_tests:
          - not_null
      - name: clan_tag
        description: Tag del clan cuyo historial se consultó.
        data_tests:
          - not_null
      - name: fetched_at_utc
        description: Fecha y hora de registro de la captura, en UTC.
        data_tests:
          - not_null
      - name: status
        description: Estado de la consulta al historial, por ejemplo ok o http_403.
        data_tests:
          - not_null
      - name: error_reason
        description: Motivo del error registrado durante la captura, cuando está disponible.
      - name: history_accessible
        description: Verdadero cuando la consulta del historial terminó correctamente.
      - name: wars_recovered
        description: Perspectivas de guerras normales recuperadas. Nulo si falló la consulta y cero si fue correcta
          y no recuperó guerras.
      - name: oldest_log_day
        description: Fecha UTC del registro más antiguo devuelto por el historial, cuando está disponible.
      - name: newest_log_day
        description: Fecha UTC del registro mas reciente devuelto por el historial, cuando está disponible.
      - name: history_reaches_month_start
        description: Indica si el historial observado llega al primer dia del mes o a una fecha anterior.

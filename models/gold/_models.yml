version: 2

models:

  - name: dim_clan
    description: >
      Catálogo de clanes con el último nombre, nivel y escudo conocidos.
    columns:
      - name: id_clan
        description: Id del clan.
        data_tests: [not_null, unique]
      - name: clan_tag
        description: Tag original utilizado para identificar al clan en los informes.
        data_tests: [not_null, unique]
      - name: clan_name
        description: Último nombre conocido en las capturas.
      - name: clan_level
        description: Último nivel conocido del clan.
      - name: badge_url
        description: Última URL conocida del escudo mediano del clan.

  - name: dim_month
    description: Meses de las temporadas CWL y de las guerras normales observadas.
    columns:
      - name: month_start_date
        description: Primer día del mes y clave compartida en Gold.
        data_tests: [not_null, unique]
      - name: month_label
        description: Etiqueta de mes en formato AAAA-MM.
        data_tests: [not_null, unique]
      - name: year_number
        description: Año natural del mes.
        data_tests: [not_null]
      - name: month_number
        description: Num del mes dentro del año.
        data_tests: [not_null]

  - name: dim_division
    description: Catálogo de divisiones CWL obtenidas de leagues.
    columns:
      - name: id_division
        description: Id de la división.
        data_tests: [not_null, unique]
      - name: division_id
        description: Código de origen de la división.
        data_tests: [not_null, unique]
      - name: division_name
        description: Nombre de la división usado en los informes.

  - name: dim_cwl_group
    description: Catálogo de grupos CWL, con su división cuando se conoce.
    columns:
      - name: id_group
        description: Id del grupo generado a partir del código y la temporada.
        data_tests: [not_null, unique]
      - name: group_id
        description: Código del grupo en la captura original.
        data_tests: [not_null]
      - name: id_division
        description: División del grupo, si se conoce.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_division')
                field: id_division

  - name: fct_war_results
    description: >
      Resultados de CWL y guerras normales con un conjunto común de medidas.
      Incluye el marcador y los ataques usados por el clan observado, junto con
      el tamaño y el cupo previstos para su bando. Una guerra puede aportar una
      perspectiva por cada clan observado.
    columns:
      - name: id_war_result
        description: Id de la perspectiva del clan en la guerra.
        data_tests: [not_null, unique]
      - name: war_type
        description: Formato de guerra.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cwl, normal]
      - name: id_war_clan
        description: Bando CWL cuando el formato es cwl.
        data_tests:
          - relationships:
              arguments:
                to: ref('cwl_war_clans')
                field: id_war_clan
      - name: id_normal_war
        description: Guerra normal cuando el formato es normal.
        data_tests:
          - relationships:
              arguments:
                to: ref('normal_wars')
                field: id_normal_war
      - name: id_clan
        description: Clan desde cuya perspectiva se registra el resultado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
      - name: id_opponent_clan
        description: Clan rival en el enfrentamiento.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
      - name: attacks_used
        description: Num de ataques realizados por el bando observado.
      - name: stars
        description: Estrellas del bando en el marcador final.
      - name: destruction_pct
        description: Porcentaje de destrucción del bando, de 0 a 100.
      - name: result
        description: Victoria, derrota o empate desde la perspectiva del clan.
      - name: id_cwl_war
        description: Identificador de la guerra CWL. Queda nulo en guerras normales.
      - name: id_group
        description: Grupo de competición. Queda nulo en guerras normales.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cwl_group')
                field: id_group
      - name: round_number
        description: Num de ronda en CWL. Queda nulo en guerras normales.
      - name: month_start_date
        description: Primer día del mes de la temporada CWL o del cierre UTC de la guerra normal.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start_date
      - name: team_size
        description: Num de jugadores que puede alinear cada bando.
      - name: attacks_available
        description: Cupo de un bando, calculado como tamaño por ataques permitidos por jugador.

  - name: fct_cwl_attacks
    description: >
      Eventos de ataque de CWL con los jugadores y clanes de ambos bandos.
      Conserva la secuencia, las estrellas, la destrucción y los ayuntamientos
      observados en esa guerra. Permite estudiar el mismo evento desde la
      perspectiva del atacante o del defensor.
    columns:
      - name: id_attack
        description: Id del evento de ataque.
        data_tests: [not_null, unique]
      - name: id_cwl_war
        description: Guerra CWL en la que se realizó el ataque.
        data_tests: [not_null]
      - name: attack_order
        description: Posición del ataque en la secuencia registrada por la API.
        data_tests: [not_null]
      - name: id_group
        description: Grupo en el que se disputó la guerra.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cwl_group')
                field: id_group
      - name: month_start_date
        description: Primer día del mes de la temporada CWL.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start_date
      - name: id_attacker
        description: Jugador que realizó el ataque.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('players')
                field: id_player
      - name: id_defender
        description: Jugador cuya base recibió el ataque.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('players')
                field: id_player
      - name: id_attacker_clan
        description: Clan al que representó el atacante en la guerra.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
      - name: id_defender_clan
        description: Clan al que representó el defensor en la guerra.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
      - name: attacker_th
        description: Nivel de ayuntamiento del atacante en esa guerra.
      - name: defender_th
        description: Nivel de ayuntamiento del defensor en esa guerra.
      - name: matchup
        description: >
          Clasificación del cruce desde la perspectiva del atacante.
          Los valores son down-hit, same-TH y up-hit. Queda nulo si falta un nivel.
        data_tests:
          - accepted_values:
              arguments:
                values: [down-hit, same-TH, up-hit]
      - name: stars
        description: Estrellas obtenidas por el atacante.
      - name: destruction_pct
        description: Porcentaje de destrucción conseguido en el ataque, de 0 a 100.

  - name: cwl_round_performance
    description: >
      Balance CWL por grupo, clan y ronda. Las tasas y los acumulados se
      calculan en Power BI a partir de los recuentos y sumas.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names: [id_group, id_clan, round_number]
    columns:
      - name: month_start_date
        description: Primer día del mes de la temporada CWL.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start_date
      - name: id_group
        description: Grupo de competición.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cwl_group')
                field: id_group
      - name: id_clan
        description: Clan al que corresponde el balance.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
      - name: round_number
        description: Ronda dentro de la temporada.
        data_tests: [not_null]
      - name: wars_played
        description: Guerras CWL observadas del clan.
        data_tests: [not_null]
      - name: wars_with_result
        description: Guerras observadas con resultado informado.
        data_tests: [not_null]
      - name: wins
        description: Guerras ganadas.
        data_tests: [not_null]
      - name: wars_with_destruction
        description: Guerras con destrucción informada.
        data_tests: [not_null]
      - name: destruction_sum
        description: Suma de los porcentajes de destrucción del clan en esas guerras.
      - name: attacks_available
        description: Cupo de las guerras con ataques informados y cupo positivo.
      - name: attacks_used
        description: Ataques realizados en esas mismas guerras.
      - name: scored_attacks
        description: Ataques del clan con estrellas informadas.
        data_tests: [not_null]
      - name: attack_stars
        description: Suma de las estrellas registradas en los ataques del clan.
        data_tests: [not_null]
      - name: triples
        description: Ataques que consiguieron tres estrellas.
        data_tests: [not_null]

  - name: town_hall_matchups
    description: >
      Compara el rendimiento ofensivo en CWL según el ayuntamiento del atacante
      y del defensor en la guerra. Permite analizar estrellas, destrucción y
      triples por temporada y división. Incluye solo ataques con ambos niveles
      conocidos.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names: [month_start_date, id_division, attacker_th, defender_th]
    columns:
      - name: month_start_date
        description: Primer día del mes de la temporada CWL.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start_date
      - name: id_division
        description: División del cruce, si se conoce.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_division')
                field: id_division
      - name: attacker_th
        description: Ayuntamiento del atacante en la guerra.
        data_tests: [not_null]
      - name: defender_th
        description: Ayuntamiento del defensor en la guerra.
        data_tests: [not_null]
      - name: matchup
        description: Tipo de cruce según la diferencia de ayuntamiento.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [down-hit, same-TH, up-hit]
      - name: attacks
        description: Ataques registrados para esta pareja de ayuntamientos.
        data_tests: [not_null]
      - name: scored_attacks
        description: Ataques para los que se conoce el Num de estrellas.
        data_tests: [not_null]
      - name: attack_stars
        description: Estrellas obtenidas en los ataques del cruce.
      - name: triples
        description: Ataques del cruce que consiguieron tres estrellas.
        data_tests: [not_null]
      - name: attacks_with_destruction
        description: Ataques con un porcentaje de destrucción informado.
        data_tests: [not_null]
      - name: destruction_sum
        description: Suma de los porcentajes de destrucción de esos ataques.

  - name: war_format_comparison
    description: >
      Compara el rendimiento de un mismo clan en CWL y guerras normales
      durante el mismo mes. Incluye clanes observados en ambos formatos.
      Las diferencias se expresan en puntos porcentuales y se calculan
      restando el valor de guerras normales al de CWL.
    data_tests:
      - unique_key_columns:
          arguments:
            column_names: [month_start_date, id_clan]
    columns:
      - name: month_start_date
        description: Primer día del mes compartido por ambos formatos.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start_date
      - name: cwl_wars_played
        description: Guerras CWL observadas.
        data_tests: [not_null]
      - name: normal_wars_played
        description: Guerras normales observadas.
        data_tests: [not_null]
      - name: cwl_win_rate_pct
        description: Porcentaje de victorias CWL entre guerras con resultado conocido.
      - name: normal_win_rate_pct
        description: Porcentaje de victorias normales entre guerras con resultado conocido.
      - name: win_rate_diff_pp
        description: Diferencia en la tasa de victorias, en puntos porcentuales.
      - name: cwl_avg_destruction_pct
        description: Destrucción media en guerras CWL con ese dato.
      - name: normal_avg_destruction_pct
        description: Destrucción media en guerras normales con ese dato.
      - name: destruction_diff_pp
        description: Diferencia en la destrucción media, en puntos porcentuales.
      - name: cwl_attack_usage_pct
        description: Porcentaje del cupo utilizado en guerras CWL con ataques y cupo conocidos.
      - name: normal_attack_usage_pct
        description: Porcentaje del cupo utilizado en guerras normales con ataques y cupo conocidos.
      - name: attack_usage_diff_pp
        description: Diferencia en el uso del cupo, en puntos porcentuales.
      - name: id_clan
        description: Id del clan comparado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clan')
                field: id_clan
